<html lang="es">
<head>

<meta property="og:description" content="Moñas, vinchas y toallas hechas a mano con amor. Mira el catálogo y pide por WhatsApp. Entrega en Barranquilla.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FDF8F3;
    --primary:#F0C4CE;
    --accent:#A54865;
    --text:#4A3B3F;
    --card:#FFFFFF;
    --line:#F0DDE2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito Sans',sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}

  .hero{
    padding:64px 24px 48px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero-deco{
    position:absolute;
    pointer-events:none;
    color:var(--season-color, var(--primary));
  }
  .hero-deco.deco-1{
    top:-80px; right:-60px;
    width:220px; height:220px;
    opacity:.35;
    filter:blur(2px);
    animation: deco-float-big 9s ease-in-out infinite;
  }
  .hero-deco.deco-2{
    bottom:-100px; left:-70px;
    width:260px; height:260px;
    opacity:.25;
    animation: deco-float-big 11s ease-in-out infinite 1.5s;
  }
  .hero-deco svg{width:100%; height:100%; display:block;}
  .hero-deco.shape-circles svg{border-radius:50%; background:currentColor;}
  .hero-deco.shape-circles{ animation: none; }
  .hero-inner{position:relative; z-index:1;}
  .hero h1{
    font-size:clamp(2.2rem,7vw,3.4rem);
    font-weight:600;
    font-style:italic;
    color:var(--accent);
    letter-spacing:.01em;
  }
  .hero p.tagline{
    margin-top:10px;
    font-size:1.05rem;
    color:var(--text);
    opacity:.75;
    font-style:italic;
    font-family:'Fraunces',serif;
  }
  .hero .deco-line{
    width:64px; height:2px;
    background:var(--accent);
    opacity:.4;
    margin:22px auto 0;
    border-radius:2px;
  }
  .hero .custom-order-btn{
    margin-top:24px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
    border-radius:999px;
    padding:11px 22px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }
  .hero .custom-order-btn:active{opacity:.8;}

  .cat-nav{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:8px 20px 20px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;
    padding:9px 20px;
    border-radius:999px;
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--text);
    font-weight:700;
    font-size:.92rem;
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
    white-space:nowrap;
  }
  .cat-pill.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .catalog{
    max-width:1000px;
    margin:0 auto;
    padding:0 20px;
  }
  .cat-section{
    margin-bottom:38px;
    padding-bottom:30px;
    border-bottom:1px solid var(--line);
  }
  .cat-section:last-child{
    border-bottom:none;
    padding-bottom:0;
  }
  .cat-section.has-season-divider{
    border-bottom:none;
    padding-bottom:0;
  }
  .season-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-bottom:38px;
    color:var(--season-color, var(--primary));
    opacity:.8;
  }
  .season-divider svg{
    width:16px; height:16px;
    flex:none;
  }
  .season-divider svg:nth-child(1),
  .season-divider svg:nth-child(4){ animation: deco-float 4.5s ease-in-out infinite; }
  .season-divider svg:nth-child(2),
  .season-divider svg:nth-child(5){ animation: deco-float 4.5s ease-in-out infinite 1.1s; }
  .season-divider svg:nth-child(3){ animation: deco-float 4.5s ease-in-out infinite 2.2s; }

  @keyframes deco-float{
    0%, 100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-5px) rotate(12deg); }
  }
  @keyframes deco-float-big{
    0%, 100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-10px) rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .season-divider svg,
    .hero-deco{ animation: none !important; }
  }

  .cat-section h2{
    font-size:1.5rem;
    font-weight:500;
    color:var(--accent);
    margin-bottom:16px;
    padding-left:2px;
  }
  .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px;
  }
  .grid .card{
    flex:1 1 160px;
    max-width:220px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    transition:transform .15s, box-shadow .15s;
  }
  .card:active{transform:scale(.98);}
  .card-photo{
    aspect-ratio:1/1;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .card-photo img{
    width:100%; height:100%;
    object-fit:cover;
    cursor:pointer;
    animation: photo-fade-in .25s ease;
  }
  @keyframes photo-fade-in{
    from{ opacity:.35; }
    to{ opacity:1; }
  }
  .card-photo .no-photo{
    color:var(--line);
    font-size:2.2rem;
    cursor:default;
  }
  .badge{
    position:absolute;
    top:8px; left:8px;
    background:var(--primary);
    color:var(--accent);
    font-size:.68rem;
    font-weight:800;
    padding:3px 9px;
    border-radius:999px;
    letter-spacing:.02em;
    z-index:2;
  }
  .badge.out{
    background:#eee;
    color:#999;
  }
  .badge.low-stock{
    background:#FFE8CC;
    color:#B5680B;
  }

  .photo-dots{
    position:absolute;
    bottom:8px; left:0; right:0;
    display:flex;
    justify-content:center;
    gap:5px;
    z-index:2;
  }
  .photo-dots .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(74,59,63,.25);
    cursor:pointer;
    padding:0;
    transition: background-color .25s ease, border-color .25s ease, transform .25s ease;
  }
  .photo-dots .dot.active{
    background:var(--accent);
    border-color:var(--accent);
    transform:scale(1.25);
  }
  .photo-nav-btn{
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:26px; height:26px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    border:none;
    color:var(--accent);
    font-size:.85rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:2;
    opacity:0;
    transition:opacity .15s;
  }
  .card-photo:hover .photo-nav-btn,
  .card-photo:active .photo-nav-btn{opacity:1;}
  .photo-nav-btn.prev{left:6px;}
  .photo-nav-btn.next{right:6px;}

  .card-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  .card-body h3{
    font-size:.98rem;
    font-weight:600;
    line-height:1.25;
  }
  .card-body p.desc{
    font-size:.82rem;
    color:var(--text);
    opacity:.7;
    flex:1;
  }
  .card-body .price{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--accent);
    margin-top:2px;
  }
  .wa-btn{
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:9px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    text-decoration:none;
  }
  .wa-btn:active{opacity:.85;}
  .wa-btn.disabled{
    background:#e8e2de;
    color:#a89a94;
    pointer-events:none;
  }
  .wa-btn svg{width:16px;height:16px;flex:none;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text);
    opacity:.6;
    font-family:'Fraunces',serif;
    font-style:italic;
  }

  .spotlight-wrap{
    max-width:1000px;
    margin:0 auto 34px;
    padding:0 20px;
  }
  .spotlight-label-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .spotlight-label{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--accent);
    font-weight:800;
    font-size:.85rem;
    letter-spacing:.02em;
  }
  .spotlight-close{
    width:30px; height:30px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--text);
    font-size:.95rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .spotlight-close:active{opacity:.7;}
  .spotlight-card{
    background:var(--card);
    border-radius:20px;
    border:2px solid var(--accent);
    box-shadow:0 8px 28px rgba(201,123,147,.22);
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr;
    animation:spotlight-in .5s ease;
  }
  @media(min-width:560px){
    .spotlight-card{grid-template-columns:220px 1fr;}
  }
  @keyframes spotlight-in{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .spotlight-photo{
    aspect-ratio:1/1;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .spotlight-photo img{width:100%; height:100%; object-fit:cover;}
  .spotlight-photo .no-photo{font-size:3rem; color:var(--line);}
  .spotlight-body{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .spotlight-body h3{font-size:1.25rem; font-weight:600;}
  .spotlight-body p.desc{font-size:.9rem; opacity:.75; flex:0;}
  .spotlight-body .price{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.4rem;
    color:var(--accent);
  }
  .spotlight-body .wa-btn{max-width:260px; margin-top:10px;}

  .closed-banner{
    max-width:1000px;
    margin:0 auto 24px;
    padding:0 20px;
  }
  .closed-banner-inner{
    background:#FFF3E0;
    color:#8A5A00;
    border-radius:14px;
    padding:16px 18px;
    font-size:.9rem;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:12px;
    border:1.5px solid #F0D9A8;
  }
  .closed-banner-inner .cb-icon{font-size:1.4rem; flex:none;}

  .order-btn{
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
    border-radius:12px;
    padding:8px;
    font-weight:700;
    font-size:.82rem;
    cursor:pointer;
    width:100%;
  }
  .order-modal-overlay{
    position:fixed; inset:0;
    background:rgba(74,59,63,.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:90;
    padding:0;
  }
  .order-modal-overlay.open{display:flex;}
  .order-modal{
    background:var(--bg);
    width:100%;
    max-width:480px;
    border-radius:22px 22px 0 0;
    padding:22px 20px 26px;
    max-height:90vh;
    overflow-y:auto;
  }
  @media(min-width:560px){
    .order-modal-overlay{align-items:center;}
    .order-modal{border-radius:22px;}
  }
  .order-modal h3{color:var(--accent); font-size:1.15rem; margin-bottom:4px;}
  .order-modal .om-product{font-size:.85rem; opacity:.7; margin-bottom:16px;}
  .order-modal label{display:block; font-size:.8rem; font-weight:700; margin-bottom:5px; opacity:.75;}
  .order-modal .field{margin-bottom:12px;}
  .order-modal input, .order-modal textarea, .order-modal select{
    width:100%; padding:10px 12px;
    border:1.5px solid var(--line); border-radius:10px;
    font-size:.92rem; background:#fff; color:var(--text);
    font-family:inherit;
  }
  .order-modal textarea{min-height:60px; resize:vertical;}
  .order-modal .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .order-modal .om-actions{display:flex; gap:10px; margin-top:16px;}
  .order-modal .om-btn{
    flex:1; padding:11px; border-radius:12px; border:none;
    font-weight:700; font-size:.9rem; cursor:pointer;
  }
  .order-modal .om-cancel{background:#fff; border:1.5px solid var(--line); color:var(--text);}
  .order-modal .om-send{background:var(--accent); color:#fff;}
  .order-modal .om-send:disabled{opacity:.6; pointer-events:none;}
  .order-confirm{
    text-align:center; padding:20px 10px;
  }
  .order-confirm .big-check{font-size:2.4rem; margin-bottom:8px;}

  .delivery-note{
    background:var(--primary);
    color:var(--accent);
    border-radius:10px;
    padding:9px 12px;
    font-size:.78rem;
    font-weight:600;
    margin:-2px 0 12px;
    display:none;
  }
  .delivery-note.show{display:block;}

  .checkbox-field{
    display:flex; align-items:center; gap:9px;
    margin-bottom:12px;
  }
  .checkbox-field input{width:auto; flex:none;}
  .checkbox-field label{margin:0; font-weight:700; font-size:.85rem; opacity:1;}

  .nequi-box{
    background:#fff;
    border:1.5px dashed var(--accent);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:12px;
    display:none;
  }
  .nequi-box.show{display:block;}
  .nequi-box .nq-number{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.2rem;
    color:var(--accent);
    margin:4px 0 8px;
  }
  .nequi-box p{font-size:.78rem; opacity:.75;}
  .proof-upload-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:#fff; border:1.5px solid var(--line); border-radius:10px;
    padding:10px; font-size:.85rem; font-weight:700; color:var(--text);
    cursor:pointer; margin-top:8px;
  }
  .proof-preview{
    display:flex; align-items:center; gap:8px; margin-top:8px;
    font-size:.8rem; background:var(--bg); border-radius:8px; padding:6px 10px;
  }
  .proof-preview img{width:36px; height:36px; border-radius:6px; object-fit:cover;}

  footer{
    max-width:1000px;
    margin:50px auto 0;
    padding:28px 24px 0;
    border-top:1px solid var(--line);
    text-align:center;
  }
  footer .biz{font-family:'Fraunces',serif; font-style:italic; color:var(--accent); font-size:1.05rem;}
  footer .meta{font-size:.85rem; opacity:.65; margin-top:6px;}
  footer .socials{margin-top:14px; display:flex; gap:14px; justify-content:center;}
  footer .socials a{
    color:var(--accent);
    text-decoration:none;
    font-weight:700;
    font-size:.85rem;
    border:1.5px solid var(--line);
    padding:7px 16px;
    border-radius:999px;
  }

  .lightbox{
    position:fixed; inset:0;
    background:rgba(74,59,63,.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:100%; max-height:85vh;
    border-radius:12px;
    background:#fff;
  }
  .lightbox-close{
    position:absolute;
    top:20px; right:20px;
    width:40px; height:40px;
    border-radius:50%;
    background:#fff;
    border:none;
    font-size:1.3rem;
    cursor:pointer;
    color:var(--text);
  }

  .loading{
    text-align:center;
    padding:60px 20px;
    opacity:.5;
    font-family:'Fraunces',serif;
    font-style:italic;
  }
</style>
<!-- Rediseño moderno -->
<style id="rediseno">
:root{
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-sheet:cubic-bezier(.32,.72,0,1);
  --accent-ink:color-mix(in srgb,var(--accent) 78%,#000);
  --ring:color-mix(in srgb,var(--accent) 22%,transparent);
  --shadow-soft:0 1px 2px rgba(74,59,63,.04),0 14px 32px -18px rgba(74,59,63,.2);
}
html{-webkit-text-size-adjust:100%;}
body{font-size:1rem;line-height:1.6;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}
button,a{cursor:pointer;}

/* Portada: más aire, título protagonista */
.hero{padding:84px 24px 52px;}
.hero h1{font-size:clamp(2.7rem,11vw,4.6rem);font-weight:500;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;}
.hero p.tagline{font-size:1.2rem;opacity:.82;margin-top:16px;text-wrap:balance;}
.hero .deco-line{width:44px;height:3px;opacity:.55;margin-top:26px;}
.hero .custom-order-btn{
  min-height:48px;padding:12px 26px;margin-top:28px;font-size:.95rem;
  border:1.5px solid var(--accent-ink);color:var(--accent-ink);box-shadow:var(--shadow-soft);
  transition:transform 160ms var(--ease-out);
}
.hero .custom-order-btn:active{transform:scale(.97);opacity:1;}

/* Categorías: isla flotante que acompaña al bajar */
.cat-nav{
  position:sticky;top:10px;z-index:30;
  margin:0 12px 34px;padding:6px;gap:4px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  box-shadow:var(--shadow-soft);
}
@media(min-width:700px){.cat-nav{max-width:640px;margin-left:auto;margin-right:auto;justify-content:center;}}
.cat-pill{
  min-height:44px;padding:0 20px;font-size:.95rem;border:none;background:transparent;
  transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease;
}
.cat-pill:active{transform:scale(.96);}
.cat-pill.active{background:var(--accent-ink);color:#fff;}

/* Catálogo */
.catalog{max-width:1100px;}
.cat-section{margin-bottom:0;padding-bottom:0;border:none;}
.cat-section h2{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:500;letter-spacing:-.015em;margin-bottom:20px;text-wrap:balance;}
.season-divider{margin:44px 0 48px;}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}}
@media(min-width:940px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
.grid .card{flex:initial;max-width:none;}

/* Tarjeta: foto enmarcada como un portarretrato */
.card{
  padding:8px;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow-soft);
  transition:transform 160ms var(--ease-out);
  animation:rise 300ms var(--ease-out) backwards;
}
.card:active{transform:scale(.985);}
.grid .card:nth-child(1){animation-delay:0ms}
.grid .card:nth-child(2){animation-delay:40ms}
.grid .card:nth-child(3){animation-delay:80ms}
.grid .card:nth-child(4){animation-delay:120ms}
.grid .card:nth-child(5){animation-delay:160ms}
.grid .card:nth-child(n+6){animation-delay:200ms}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98);}}

function renderHeroDecoration(shapeKey){
  const deco1 = document.getElementById('hero-deco-1');
  const deco2 = document.getElementById('hero-deco-2');
  const path = SEASON_SHAPES[shapeKey];

  [deco1, deco2].forEach(el => el.classList.remove('shape-circles'));

  if(!path){
    // Tema clásico: círculo sólido vía CSS (currentColor de fondo)
    deco1.classList.add('shape-circles');
    deco2.classList.add('shape-circles');
    deco1.innerHTML = '';
    deco2.innerHTML = '';
    return;
  }

  const svg = (strokeOnly) => `
    <svg viewBox="0 0 24 24" ${strokeOnly ? 'fill="none" stroke="currentColor" stroke-width="0.9"' : 'fill="currentColor"'} stroke-linecap="round" stroke-linejoin="round">
      <path d="${path}"/>
    </svg>`;
  deco1.innerHTML = svg(false);
  deco2.innerHTML = svg(false);
}

function applyConfig(cfg){
  CONFIG = { ...CONFIG, ...cfg };
  const root = document.documentElement.style;
  root.setProperty('--bg', CONFIG.color_bg);
  root.setProperty('--primary', CONFIG.color_primary);
  root.setProperty('--accent', CONFIG.color_accent);
  root.setProperty('--text', CONFIG.color_text);
  root.setProperty('--season-color', CONFIG.season_color || CONFIG.color_primary);
  renderHeroDecoration(CONFIG.season_shape || 'circles');
  document.title = CONFIG.business_name;
  document.getElementById('biz-name').textContent = CONFIG.business_name;
  document.getElementById('biz-tagline').textContent = CONFIG.tagline;
  document.getElementById('footer-biz').textContent = CONFIG.business_name;
  document.getElementById('footer-meta').textContent = 'Entrega en persona en ' + CONFIG.city;

  const socials = document.getElementById('footer-socials');
  socials.innerHTML = '';
  if(CONFIG.whatsapp_number){
    const a = document.createElement('a');
    a.href = waLink(CONFIG.whatsapp_number, `Hola, quiero más información sobre ${CONFIG.business_name} 🌸`);
    a.target = '_blank';
    a.textContent = 'WhatsApp';
    socials.appendChild(a);
  }
  if(CONFIG.facebook_url){
    const a = document.createElement('a');
    a.href = CONFIG.facebook_url;
    a.target = '_blank';
    a.textContent = 'Facebook';
    socials.appendChild(a);
  }

  const heroWa = document.getElementById('hero-wa-btn');
  if(heroWa){
    if(CONFIG.whatsapp_number){
      heroWa.href = waLink(CONFIG.whatsapp_number, `Hola, quiero más información sobre ${CONFIG.business_name} 🌸`);
      heroWa.style.display = '';
    } else {
      heroWa.style.display = 'none';
    }
  }

  const banner = document.getElementById('closed-banner');
  const customOrderBtn = document.getElementById('open-custom-order-btn');
  if(!CONFIG.is_open){
    document.getElementById('closed-message').textContent = CONFIG.closed_message;
    banner.style.display = 'block';
    customOrderBtn.disabled = true;
    customOrderBtn.style.opacity = '.5';
    customOrderBtn.style.pointerEvents = 'none';
  } else {
    banner.style.display = 'none';
    customOrderBtn.disabled = false;
    customOrderBtn.style.opacity = '1';
    customOrderBtn.style.pointerEvents = 'auto';
  }
}

function waLink(number, text){
  const clean = number.replace(/\D/g,'');
  const withCountry = clean.startsWith('57') ? clean : '57' + clean;
  return `https://wa.me/${withCountry}?text=${encodeURIComponent(text)}`;
}

function productWaLink(p){
  const msg = `Hola 🌸 Me interesa "${p.name}" (${money(p.price)}). ¿Está disponible?`;
  return waLink(CONFIG.whatsapp_number, msg);
}

  window.history.replaceState({}, '', url);

}

function renderCatalog(categories, products){
  const catalog = document.getElementById('catalog');
  catalog.innerHTML = '';

  const visibleCats = activeCategory === 'all'
    ? categories
    : categories.filter(c => c.id === activeCategory);

  const visibleWithItems = visibleCats.filter(cat =>
    products.some(p => p.category_id === cat.id)
  );

  visibleWithItems.forEach((cat, idx) => {
    const items = products.filter(p => p.category_id === cat.id);

    const section = document.createElement('section');
    section.className = 'cat-section has-season-divider';
    section.innerHTML = `<h2>${cat.name}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(p => grid.appendChild(renderCard(p)));
    section.appendChild(grid);
    catalog.appendChild(section);

    const isLast = idx === visibleWithItems.length - 1;
    if(!isLast){
      catalog.appendChild(buildSeasonDivider());
    }
  });

  if(visibleWithItems.length === 0){
    catalog.innerHTML = '<div class="empty-state">' + icon('bow') + 'Muy pronto verás productos por aquí</div>';
  }
}

function buildSeasonDivider(){
  const shapeKey = CONFIG.season_shape || 'circles';
  const path = SEASON_SHAPES[shapeKey];
  const div = document.createElement('div');
  div.className = 'season-divider';

  const count = 5;
  let svgs = '';
  for(let i = 0; i < count; i++){
    if(!path){
      // Tema clásico: puntitos sólidos, sin figura ni movimiento
      svgs += `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>`;
    } else {
      svgs += `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${path}"/></svg>`;
    }
  }
  div.innerHTML = svgs;
  return div;
}

function renderCard(p){
  const card = document.createElement('article');
  card.className = 'card';

  const photo = document.createElement('div');
  photo.className = 'card-photo';
  const photos = (p.photos && p.photos.length) ? p.photos : [];

  if(!(p.id in cardPhotoIndex)) cardPhotoIndex[p.id] = 0;

  function paintPhoto(){
    photo.querySelectorAll('img, .no-photo, .photo-nav-btn, .photo-dots').forEach(el => el.remove());
    const idx = cardPhotoIndex[p.id] || 0;

    if(photos.length === 0){
      const span = document.createElement('span');
      span.className = 'no-photo';
      span.innerHTML = icon('bow');
      photo.appendChild(span);
      return;
    }

    const img = document.createElement('img');
    img.src = photos[idx];
    img.alt = p.name;
    img.loading = 'lazy';
    img.onclick = () => openLightbox(photos[idx], p.name);
    photo.appendChild(img);

    if(photos.length > 1){
      const prevBtn = document.createElement('button');
      prevBtn.className = 'photo-nav-btn prev';
      prevBtn.innerHTML = icon('chevL');
      prevBtn.setAttribute('aria-label', 'Foto anterior');
      prevBtn.onclick = (e) => {
        e.stopPropagation();
        cardPhotoIndex[p.id] = (idx - 1 + photos.length) % photos.length;
        paintPhoto();
      };

      const nextBtn = document.createElement('button');
      nextBtn.className = 'photo-nav-btn next';
      nextBtn.innerHTML = icon('chevR');
      nextBtn.setAttribute('aria-label', 'Foto siguiente');
      nextBtn.onclick = (e) => {
        e.stopPropagation();
        cardPhotoIndex[p.id] = (idx + 1) % photos.length;
        paintPhoto();
      };

      const dots = document.createElement('div');
      dots.className = 'photo-dots';
      photos.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'dot' + (i === idx ? ' active' : '');
        dot.setAttribute('aria-label', `Ver foto ${i+1}`);
        dot.onclick = (e) => {
          e.stopPropagation();
          cardPhotoIndex[p.id] = i;
          paintPhoto();
        };
        dots.appendChild(dot);
      });

      photo.appendChild(prevBtn);
      photo.appendChild(nextBtn);
      photo.appendChild(dots);
    }
  }
  paintPhoto();

  const isLowStock = p.in_stock && p.stock_quantity != null && p.stock_quantity > 0 && p.stock_quantity <= (CONFIG.low_stock_threshold ?? 3);

  if(p.is_combo){
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = 'Combo';
    photo.appendChild(b);
  } else if(!p.in_stock){
    const b = document.createElement('span');
    b.className = 'badge out';
    b.textContent = 'Agotado';
    photo.appendChild(b);
  } else if(isLowStock){
    const b = document.createElement('span');
    b.className = 'badge low-stock';
    b.textContent = `¡Solo quedan ${p.stock_quantity}!`;
    photo.appendChild(b);
  }

  const body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = `
    <h3>${escapeHtml(p.name)}</h3>
    ${p.description ? `<p class="desc">${escapeHtml(p.description)}</p>` : ''}
    <div class="price">${money(p.price)}</div>
  `;

  const btn = document.createElement('a');
  const canOrder = p.in_stock && CONFIG.is_open;
  btn.className = 'wa-btn' + (canOrder ? '' : ' disabled');
  btn.href = canOrder ? productWaLink(p) : '#';
  btn.target = '_blank';
  btn.innerHTML = `
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 4.99L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.06c-1.5 0-2.97-.4-4.25-1.16l-.3-.18-3.15.83.84-3.07-.2-.32a8.06 8.06 0 0 1-1.24-4.25c0-4.46 3.63-8.09 8.1-8.09 2.16 0 4.2.85 5.72 2.37a8.03 8.03 0 0 1 2.37 5.72c0 4.47-3.63 8.15-8.09 8.15z"/></svg>
    ${p.in_stock ? (CONFIG.is_open ? '<span class="lbl-long">Pedir por </span>WhatsApp' : 'Tienda cerrada') : 'Agotado por ahora'}
  `;

  body.appendChild(btn);

  if(canOrder){
    const orderBtn = document.createElement('button');
    orderBtn.className = 'order-btn';
    orderBtn.textContent = 'Hacer pedido';
    orderBtn.onclick = () => openOrderModal(p);
    body.appendChild(orderBtn);
  }

  card.appendChild(photo);
  card.appendChild(body);
  return card;
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function openLightbox(url, alt){
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').onclick = () => document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').onclick = (e) => { if(e.target.id === 'lightbox') e.target.classList.remove('open'); };

async function loadFromSupabase(){
  const { data: cfg } = await sb.from('site_config').select('*').eq('id', 1).single();
  if(cfg) applyConfig(cfg);

  const { data: categories } = await sb.from('categories').select('*').order('sort_order');
  const { data: products } = await sb.from('products').select('*').order('sort_order');
  const { data: photos } = await sb.from('product_photos').select('*').order('sort_order');

  const photosByProduct = {};
  (photos || []).forEach(ph => {
    if(!photosByProduct[ph.product_id]) photosByProduct[ph.product_id] = [];
    photosByProduct[ph.product_id].push(ph.photo_url);
  });

  ALL_CATEGORIES = categories || [];
  ALL_PRODUCTS = (products || []).map(p => ({
    ...p,
    photos: photosByProduct[p.id] || []
  }));

  refreshCatalogView();
}

  applyConfig(CONFIG);
  ALL_CATEGORIES = DEMO_CATEGORIES;

  refreshCatalogView();
}

function wireDeliveryAndPaymentFields(){
  const deliverySel = document.getElementById('om-delivery');
  const note = document.getElementById('om-delivery-note');
  deliverySel.onchange = () => {
    note.classList.toggle('show', deliverySel.value === 'domicilio');
  };

  const advanceChk = document.getElementById('om-advance');
  const nequiBox = document.getElementById('om-nequi-box');
  document.getElementById('om-nequi-number').textContent = CONFIG.nequi_number || '—';
  document.getElementById('om-nequi-holder').textContent = CONFIG.nequi_holder_name
    ? `A nombre de: ${CONFIG.nequi_holder_name}`
    : '';
  advanceChk.onchange = () => {
    nequiBox.classList.toggle('show', advanceChk.checked);
  };

  const proofBtn = document.getElementById('om-proof-btn');
  const proofInput = document.getElementById('om-proof-input');
  proofBtn.onclick = () => proofInput.click();
  proofInput.onchange = () => {
    const file = proofInput.files[0];
    const preview = document.getElementById('om-proof-preview');
    if(!file){ preview.innerHTML = ''; return; }
    const localUrl = URL.createObjectURL(file);
    preview.innerHTML = `<div class="proof-preview"><img src="${localUrl}" alt="Vista previa del comprobante de pago"><span>${escapeHtml(file.name)}</span></div>`;
  };
}

function getDeliveryAndPaymentValues(){
  return {
    delivery_method: document.getElementById('om-delivery').value,
    address: document.getElementById('om-address').value.trim(),
    advance_payment: document.getElementById('om-advance').checked,
    proofFile: document.getElementById('om-proof-input').files[0] || null
  };
}

async function uploadProofIfAny(proofFile){
  if(!proofFile || !sb) return null;
  const ext = (proofFile.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await sb.storage.from('payment-proofs').upload(path, proofFile);
  if(error){
    console.error('Error subiendo comprobante:', error);
    alert('No se pudo subir el comprobante: ' + error.message);
    return null;
  }
  return path;
}

function consentFieldHTML(){
  return `
    <div class="checkbox-field" style="align-items:flex-start;">
      <input type="checkbox" id="om-consent" style="margin-top:3px;">
      <label for="om-consent" style="font-weight:600; font-size:.78rem; opacity:.85; line-height:1.4;">
        Acepto que mis datos (nombre, dirección y los demás que escriba aquí) se usen únicamente para gestionar este pedido y contactarme por WhatsApp.
      </label>
    </div>
  `;
}

function hasConsent(){
  const chk = document.getElementById('om-consent');
  if(chk && !chk.checked){
    alert('Para continuar, marca la casilla de autorización de tus datos.');
    return false;
  }
  return true;
}

function openOrderModal(p){
  const overlay = document.getElementById('order-modal-overlay');
  const content = document.getElementById('order-modal-content');
  content.innerHTML = `
    <h3>Hacer pedido</h3>
    <div class="om-product">${escapeHtml(p.name)} · ${money(p.price)}</div>
    <div class="field">
      <label>Tu nombre</label>
      <input type="text" id="om-name" placeholder="¿Cómo te llamas?">
    </div>
    <div class="field">
      <label>Cantidad</label>
      <input type="number" id="om-qty" value="1" min="1">
    </div>
    ${deliveryAndPaymentFieldsHTML()}
    <div class="field">
      <label>Nota (opcional)</label>
      <textarea id="om-note" placeholder="Ej: color, talla, para cuándo lo necesitas..."></textarea>
    </div>
    ${consentFieldHTML()}
    <div class="om-actions">
      <button class="om-btn om-cancel" id="om-cancel">Cancelar</button>
      <button class="om-btn om-send" id="om-send">Enviar pedido</button>
    </div>
  `;
  overlay.classList.add('open');
  wireDeliveryAndPaymentFields();

  document.getElementById('om-cancel').onclick = () => overlay.classList.remove('open');

  document.getElementById('om-send').onclick = async () => {
    if(!CONFIG.is_open){
      alert('Lo sentimos, no estamos recibiendo pedidos en este momento.');
      return;
    }
    if(!hasConsent()) return;
    const name = document.getElementById('om-name').value.trim();
    const qty = Number(document.getElementById('om-qty').value) || 1;
    const note = document.getElementById('om-note').value.trim();
    const { delivery_method, address, advance_payment, proofFile } = getDeliveryAndPaymentValues();

    if(!name){ alert('Por favor escribe tu nombre.'); return; }
    if(!address){ alert('Por favor escribe tu dirección.'); return; }

    const sendBtn = document.getElementById('om-send');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Enviando…';

    let payment_proof_url = null;
    if(advance_payment && proofFile){
      payment_proof_url = await uploadProofIfAny(proofFile);
      if(!payment_proof_url){
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar pedido';
        return;
      }
    }

    if(sb){
      try{
        const { error } = await sb.from('orders').insert({
          product_id: p.id,
          product_name: p.name,
          product_price: p.price,
          customer_name: name,
          quantity: qty,
          note: note,
          address: address,
          delivery_method: delivery_method,
          advance_payment: advance_payment,
          payment_proof_url: payment_proof_url
        });
        if(error) throw error;
      }catch(e){
        console.error('Error guardando pedido:', e);
        alert('No se pudo enviar el pedido. Revisa los datos e inténtalo de nuevo.');
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar pedido';
        return;
      }
    }

    content.innerHTML = `
      <div class="order-confirm">
        <div class="big-check">${icon('checkCircle')}</div>
        <h3>¡Pedido recibido!</h3>
        <p style="font-size:.9rem; opacity:.75; margin-top:6px;">Ahora escríbenos por WhatsApp para confirmar los detalles.</p>
        <div class="om-actions" style="margin-top:18px;">
          <button class="om-btn om-cancel" id="om-close">Cerrar</button>
          <a class="om-btn om-send" style="text-decoration:none; display:flex; align-items:center; justify-content:center;"
             href="${waLink(CONFIG.whatsapp_number, `Hola 🌸 Acabo de hacer un pedido de "${p.name}" (x${qty}) a nombre de ${name}. Dirección: ${address} (${delivery_method === 'domicilio' ? 'domicilio' : 'lo recojo yo'}). ${advance_payment ? 'Ya hice el pago adelantado.' : ''} ${note ? 'Nota: ' + note : ''}`)}"
             target="_blank">Ir a WhatsApp</a>
        </div>
      </div>
    `;
    document.getElementById('om-close').onclick = () => overlay.classList.remove('open');
  };
}

    <div class="om-product">Cuéntanos qué tienes en mente y coordinamos los detalles.</div>
    <div class="field">
      <label>Tu nombre</label>
      <input type="text" id="om-name" placeholder="¿Cómo te llamas?">
    </div>
    <div class="field">
      <label>¿Qué quieres encargar?</label>
      <textarea id="om-desc" placeholder="Describe el encargo: tipo de moña, colores, cantidad, etc."></textarea>

      <button class="om-btn om-send" id="om-send">Enviar encargo</button>

  overlay.classList.add('open');
  wireDeliveryAndPaymentFields();

    if(!CONFIG.is_open){

    const name = document.getElementById('om-name').value.trim();

    const { delivery_method, address, advance_payment, proofFile } = getDeliveryAndPaymentValues();

    const sendBtn = document.getElementById('om-send');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Enviando…';

    let payment_proof_url = null;
    if(advance_payment && proofFile){
      payment_proof_url = await uploadProofIfAny(proofFile);
      if(!payment_proof_url){
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar encargo';
        return;
      }
    }

    if(sb){
      try{
        const { error } = await sb.from('custom_orders').insert({
          customer_name: name,
          description: description,
          date_from: dateFrom,
          date_to: dateTo,
          note: note,
          address: address,
          delivery_method: delivery_method,
          advance_payment: advance_payment,
          payment_proof_url: payment_proof_url
        });
        if(error) throw error;
      }catch(e){
        console.error('Error guardando encargo:', e);
        alert('No se pudo enviar el encargo. Revisa los datos e inténtalo de nuevo.');
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar encargo';
        return;
      }
    }

    content.innerHTML = `
      <div class="order-confirm">
        <div class="big-check">${icon('sparkle')}</div>
        <h3>¡Encargo recibido!</h3>
        <p style="font-size:.9rem; opacity:.75; margin-top:6px;">Ahora escríbenos por WhatsApp para confirmar los detalles.</p>
        <div class="om-actions" style="margin-top:18px;">
          <button class="om-btn om-cancel" id="om-close">Cerrar</button>
          <a class="om-btn om-send" style="text-decoration:none; display:flex; align-items:center; justify-content:center;"
             href="${waLink(CONFIG.whatsapp_number, `Hola 🌸 Quiero hacer un encargo especial: "${description}". Lo necesito entre ${dateFrom} y ${dateTo}. Dirección: ${address} (${delivery_method === 'domicilio' ? 'domicilio' : 'lo recojo yo'}). A nombre de ${name}. ${advance_payment ? 'Ya hice el pago adelantado.' : ''} ${note ? 'Nota: ' + note : ''}`)}"
             target="_blank">Ir a WhatsApp</a>

  };

document.getElementById('open-custom-order-btn').onclick = () => {
  if(!CONFIG.is_open){
    alert('Lo sentimos, no estamos recibiendo encargos en este momento.');
    return;
  }
  openCustomOrderModal();
};

document.getElementById('order-modal-overlay').onclick = (e) => {
  if(e.target.id === 'order-modal-overlay') e.target.classList.remove('open');
};

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    document.getElementById('order-modal-overlay').classList.remove('open');
    document.getElementById('lightbox').classList.remove('open');
  }
});

  if(sb){
    try {
      await loadFromSupabase();
    } catch(e){
      console.error('Error cargando Supabase, usando datos de ejemplo:', e);
      loadDemo();
    }
  } else {
    loadDemo();
  }
}

init();

/* Aparición suave al hacer scroll (estilo Superr) */
(function(){
  const catalog = document.getElementById('catalog');
  if(!catalog) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const io = ('IntersectionObserver' in window && !reduce)
    ? new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
        });
      }, { rootMargin:'0px 0px -6% 0px', threshold:0.06 })
    : null;
  function markReveals(){
    catalog.querySelectorAll('.card:not(.reveal), .cat-section h2:not(.reveal)').forEach(el => {
      el.classList.add('reveal');
      if(io){ io.observe(el); } else { el.classList.add('in'); }
    });
  }
  new MutationObserver(markReveals).observe(catalog, { childList:true, subtree:true });
  markReveals();
})();
</script>
